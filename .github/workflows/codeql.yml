name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: yohn-jp/.github/.github/workflows/codeql.yml@49a11303f40de2663b61aa9ece0925d8acb381f8
    with:
      languages: "javascript-typescript,actions"
      config-file: .github/codeql/codeql-config.yml
