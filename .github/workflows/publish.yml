name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: yohn-jp/.github/.github/workflows/npm-publish.yml@f9ac0b0ea6f50b815d2f2b6f4c97650d79b9b994
    with:
      working-directory: .
      node-version: "22"
      smoke-test-node-versions: "22,24"
      npm-cli-version: "11.5.1"
